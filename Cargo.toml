[package]
name = "terminal"
version = "0.2.0"
edition = "2021"
description = "Full terminal emulator"

[dependencies]
# Terminal emulation
alacritty_terminal = "0.25"
# GUI framework with wgpu backend for GPU acceleration
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
# PTY support
portable-pty = "0.8"
# Async runtime
tokio = { version = "1", features = ["full"] }
# Error handling
anyhow = "1"
# Logging
log = "0.4"
env_logger = "0.11"
# Regex
regex = "1"
# Process info
sysinfo = "0.31"
# Clipboard
arboard = "3"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Directories
dirs = "5"
# UUID for tab IDs
uuid = { version = "1", features = ["v4"] }
# Unicode width for CJK character support
unicode-width = "0.1"
